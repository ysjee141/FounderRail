id: incident
name: Incident Response
description: 기술·데이터·고객 영향을 분리하고 외부 행동 전 사람 결정을 준비한다.
steps:
  - id: technical-triage
    type: agent
    agent: engineering
    execution: standard
    prompt: 기술 영향, 증거, 완화안과 복구·rollback 선택지를 정리한다. 프로덕션 조치는 실행하지 않는다.
    requires: []
    when: always
    retry: 0
  - id: risk-triage
    type: agent
    agent: risk-quality
    execution: standard
    prompt: 데이터·보안 영향, 증거 보존, 통지 검토 필요성과 전문가 질문을 정리한다.
    requires: []
    when: always
    retry: 0
  - id: customer-impact
    type: agent
    agent: product-growth
    execution: standard
    prompt: 영향을 받은 고객과 지원 대응·공지 초안을 준비하되 발송하지 않는다.
    requires: [technical-triage, risk-triage]
    when: always
    retry: 0
  - id: incident-decision
    type: agent
    agent: founder-office
    execution: standard
    prompt: 즉시 결정할 조치, 승인 대상, 전문가 escalation과 후속 점검을 정리한다.
    requires: [technical-triage, risk-triage, customer-impact]
    when: always
    retry: 0
